---
# Tool releases this SDK was last reviewed against. The tooling-drift tool
# (mise run tooling:status / tooling:publish) compares each with the latest
# release and opens a pull request when it moves; its README documents this
# file.
assignee: timmo001
tools:
  - repo: cli/cli
    reviewed: v2.105.0
    update: mise run tooling:refresh
    review: Check each changed snapshot under tooling/gh against the wrapper in src/ that uses the command, and adjust the SDK where a flag or --json field it relies on moved. A changed group help page (gh.txt, issue.txt and the like) lists a new or removed command or subcommand; consider whether the SDK should wrap it, and whether the OpenCode plugin in opencode-plugin/ should offer it as a tool.
  - repo: github/gh-stack
    reviewed: v0.3.0
    update: mise run tooling:refresh:stack
    review: Check each changed snapshot under tooling/gh-stack against src/stack.ts, which wraps every gh stack command. A changed flag or argument means a wrapper's arguments move; a new or removed command in stack.txt means a function to add or drop, and a section in scripts/gh-contract.ts's stackCommands. source.txt holds what no help page shows; match Stack.View to the view --json structs, exitReason to the exit codes and parseSync to sync's closing messages. Note the release notes' behaviour changes, such as new prompts, in the function docs.
