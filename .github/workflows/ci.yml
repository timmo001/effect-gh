---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Check and build
        run: "mise run check ::: build"

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0
