---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      name: Check and build
      task: "check ::: build"
      install-args: node bun

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
