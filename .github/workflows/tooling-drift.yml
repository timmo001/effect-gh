---
name: Tooling drift

# Opens one pull request when a gh release newer than the one recorded in
# tooling.yml is out, through the tooling-drift tool pinned in mise.toml.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tooling-drift
  cancel-in-progress: false

jobs:
  drift:
    if: github.repository == 'timmo001/effect-gh'
    uses: timmo001/workflows/.github/workflows/tooling-drift.yml@b84616ec41e1f60311a91509f4f20fa3837799f4 # master
    permissions:
      actions: write
      contents: write
      pull-requests: write
    secrets:
      token: ${{ secrets.TOOLING_DRIFT_TOKEN }}
