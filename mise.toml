min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.5"
pitchfork = "2.35.0"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies and patch TypeScript with the Effect language service"
# Not prepare or prepack scripts: a git dependency with either makes npm install
# every devDependency in its clone, which the OpenCode plugin's install hits.
run = [
  "bun install --frozen-lockfile",
  "bun x effect-tsgo patch --force=false",
]

[tasks."install:plugin"]
description = "Install the OpenCode plugin's dependencies"
# On its own, as OpenCode installs it: it needs the effect version OpenCode's
# plugin package pins, and checks against the published SDK it pins.
run = "bun install --frozen-lockfile --cwd opencode-plugin"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
# Type-aware lint covers opencode-plugin/, so its dependencies must be installed.
depends = ["install", "install:plugin"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks."typecheck:plugin"]
description = "Type-check the OpenCode plugin"
depends = ["install", "install:plugin"]
run = "bun x tsc -p opencode-plugin"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, test, verify formatting and check the docs site"
depends = [
  "lint",
  "typecheck",
  "typecheck:plugin",
  "test",
  "format:check",
  "docs:lint",
  "docs:check",
]

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:lint"]
description = "Lint the docs site with the shared Oxlint rules"
depends = ["docs:install"]
dir = "docs"
run = "bun run lint"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."docs:plan"]
description = "Build the docs site, then show what deploying its prod stage would change"
depends = ["docs:build"]
dir = "docs"
run = "bun run plan"

[tasks."docs:deploy"]
description = "Build the docs site, then deploy its prod stage with Alchemy"
depends = ["docs:build"]
dir = "docs"
run = "bun run deploy"

[tasks."docs:deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["docs:install"]
dir = "docs"
run = "bun run deploy:github"

[tasks."docs:check"]
description = "Check the docs site's pages, links and types without disturbing a running dev server"
depends = ["docs:install"]
dir = "docs"
# The tsconfig reads Blume's generated types from .blume/. When it exists a dev
# server may be using it, so check in --isolated's .blume-verify/ and keep
# reading those types; in a fresh checkout such as CI, generate .blume/ itself.
run = "if [ -d .blume ]; then bun run check -- --isolated; else bun run check; fi"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.test]
description = "Run SDK contract tests"
depends = ["install"]
run = "bun run test"

[tasks.build]
description = "Build ESM and TypeScript declarations into dist"
depends = ["install"]
run = "bun run build"

[tasks."tooling:refresh"]
description = "Regenerate the gh contract snapshot under tooling/gh from a cli/cli release"
depends = ["install"]
usage = 'arg "<tag>" help="Release tag, e.g. v2.102.0"'
run = "bun scripts/gh-contract.ts --release $usage_tag"
