min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.3"
# Approved for aube's package-age check while the package is under 30 days old.
"npm:@timmo001/tooling-drift" = { version = "0.1.0", allow_low_downloads = true }

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, test and verify formatting"
depends = ["lint", "typecheck", "test", "format:check"]

[tasks.test]
description = "Run SDK contract tests"
depends = ["install"]
run = "bun run test"

[tasks.build]
description = "Build ESM and TypeScript declarations into dist"
depends = ["install"]
run = "bun run build"

[tasks."tooling:status"]
description = "Compare the reviewed gh release in tooling.yml with the latest cli/cli release"
run = "tooling-drift status"

[tasks."tooling:refresh"]
description = "Regenerate the gh contract snapshot under tooling/gh from a cli/cli release"
depends = ["install"]
run = 'bun scripts/gh-contract.ts --release {{arg(name="tag")}}'

[tasks."tooling:update"]
description = "Refresh the gh contract snapshot at a cli/cli release and record it in tooling.yml"
run = 'tooling-drift update cli/cli {{arg(name="tag")}}'

[tasks."tooling:publish"]
description = "Open or refresh a pull request when a newer gh release is out"
run = "tooling-drift publish"
