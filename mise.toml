min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.3"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, test and verify formatting"
depends = ["lint", "typecheck", "test", "format:check"]

[tasks.test]
description = "Run SDK contract tests"
depends = ["install"]
run = "bun run test"

[tasks.build]
description = "Build ESM and TypeScript declarations into dist"
depends = ["install"]
run = "bun run build"

[tasks."tooling:status"]
description = "Compare the reviewed gh release in tooling.yml with the latest cli/cli release"
run = "scripts/tooling-drift.sh status"

[tasks."tooling:update"]
description = "Refresh the gh contract snapshot at a cli/cli release and record it in tooling.yml"
depends = ["install"]
run = 'scripts/tooling-drift.sh update cli/cli {{arg(name="tag")}}'
